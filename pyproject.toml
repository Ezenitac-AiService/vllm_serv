[project]
name = "vllm-serv"
version = "0.1.0"
description = "vLLM Model Serving and Configuration Dashboard Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "sse-starlette>=3.4.6",
    "uvicorn>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
